<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 838 1275' width='838' height='1275'>
  <defs>
    <!-- Filtros de relevo e sombra plana -->
    <filter id='drop-shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#000000' flood-opacity='0.8'/>
    </filter>
    <filter id='text-shadow'>
      <feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#000000' flood-opacity='0.9'/>
    </filter>

    <!-- Gradientes Metálicos e Gemas Hearthstone -->
    <linearGradient id='gold-grad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#fef08a'/>
      <stop offset='30%' stop-color='#f59e0b'/>
      <stop offset='70%' stop-color='#d97706'/>
      <stop offset='100%' stop-color='#78350f'/>
    </linearGradient>

    <linearGradient id='frame-wood' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#3f3f46'/>
      <stop offset='50%' stop-color='#18181b'/>
      <stop offset='100%' stop-color='#09090b'/>
    </linearGradient>

    <radialGradient id='mana-gem' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#93c5fd'/>
      <stop offset='40%' stop-color='#3b82f6'/>
      <stop offset='85%' stop-color='#1d4ed8'/>
      <stop offset='100%' stop-color='#172554'/>
    </radialGradient>

    <radialGradient id='health-gem' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#fca5a5'/>
      <stop offset='40%' stop-color='#ef4444'/>
      <stop offset='85%' stop-color='#b91c1c'/>
      <stop offset='100%' stop-color='#450a0a'/>
    </radialGradient>

    <radialGradient id='attack-shield' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#fef08a'/>
      <stop offset='50%' stop-color='#eab308'/>
      <stop offset='85%' stop-color='#ca8a04'/>
      <stop offset='100%' stop-color='#713f12'/>
    </radialGradient>

    <!-- Máscara de recorte do retrato oval do lacaio -->
    <mask id='portrait-cutout'>
      <rect width='838' height='1275' fill='white'/>
      <!-- Abertura oval central para o vídeo anime -->
      <ellipse cx='419' cy='520' rx='340' ry='400' fill='black'/>
    </mask>
  </defs>

  <!-- 1. MOLDURA EXTERNA DA CARTA (Com recorte do retrato do lacaio) -->
  <g mask='url(#portrait-cutout)' filter='url(#drop-shadow)'>
    <!-- Borda externa escura com chanfro -->
    <rect x='20' y='20' width='798' height='1235' rx='36' fill='none' stroke='url(#gold-grad)' stroke-width='16'/>
    <!-- Moldura ornamental de suporte -->
    <path d='M 30,30 L 808,30 L 808,1245 L 30,1245 Z' fill='url(#frame-wood)' opacity='0.92'/>
  </g>

  <!-- Anel Dourado do Retrato Oval -->
  <ellipse cx='419' cy='520' rx='342' ry='402' fill='none' stroke='url(#gold-grad)' stroke-width='18' filter='url(#drop-shadow)'/>
  <ellipse cx='419' cy='520' rx='332' ry='392' fill='none' stroke='#78350f' stroke-width='4'/>

  <!-- Coroa de Dragão Lendário no topo -->
  <g transform='translate(419, 90) scale(1.1)' filter='url(#drop-shadow)'>
    <path d='M-180,-10 C-100,-40 100,-40 180,-10 C140,-5 100,10 0,25 C-100,10 -140,-5 -180,-10 Z' fill='url(#gold-grad)' stroke='#78350f' stroke-width='3'/>
    <path d='M-40,-5 L0,-45 L40,-5 L0,-15 Z' fill='url(#gold-grad)' stroke='#78350f' stroke-width='3'/>
    <circle cx='0' cy='-8' r='14' fill='#f97316' stroke='#78350f' stroke-width='3'/>
  </g>

  <!-- FAIXA DE NOME DO LACAIO (Abaixo do Retrato) -->
  <g transform='translate(419, 890)' filter='url(#drop-shadow)'>
    <!-- Fita do Nome -->
    <path d='M-280,-35 L280,-35 L300,35 L-300,35 Z' fill='#18181b' stroke='url(#gold-grad)' stroke-width='8'/>
    <!-- Gema Lendária Central -->
    <polygon points='0,-22 18,0 0,22 -18,0' fill='#f97316' stroke='#ffffff' stroke-width='2'/>
    <!-- Texto do Nome -->
    <text x='0' y='12' font-family='Arial, sans-serif' font-weight='900' font-size='38' fill='#fef08a' stroke='#451a03' stroke-width='3' paint-order='stroke fill' text-anchor='middle' filter='url(#text-shadow)'>
      GIRL WARRIORS
    </text>
  </g>

  <!-- 2. ÍCONE DE CUSTO (MANA) - Topo Esquerdo -->
  <g transform='translate(100, 110)' filter='url(#drop-shadow)'>
    <!-- Anel Dourado Exterior -->
    <polygon points='0,-68 48,-48 68,0 48,48 0,68 -48,48 -68,0 -48,-48' fill='url(#gold-grad)' stroke='#451a03' stroke-width='6'/>
    <!-- Cristal de Mana Azul -->
    <polygon points='0,-54 38,-38 54,0 38,38 0,54 -38,38 -54,0 -38,-38' fill='url(#mana-gem)' stroke='#93c5fd' stroke-width='3'/>
    <!-- Destaque de Brilho Superior -->
    <polygon points='0,-48 28,-30 0,-15 -28,-30' fill='#ffffff' opacity='0.4'/>
    <!-- Número do Custo -->
    <text x='0' y='28' font-family='Arial, sans-serif' font-weight='900' font-size='82' fill='#ffffff' stroke='#09142b' stroke-width='10' paint-order='stroke fill' text-anchor='middle' filter='url(#text-shadow)'>
      5
    </text>
  </g>

  <!-- 3. ÍCONE DE ATAQUE - Inferior Esquerdo -->
  <g transform='translate(105, 1160)' filter='url(#drop-shadow)'>
    <!-- Brasão Dourado de Espadas / Estrela denteada -->
    <g transform='scale(1.1)'>
      <rect x='-48' y='-48' width='96' height='96' rx='10' fill='url(#gold-grad)' stroke='#451a03' stroke-width='5'/>
      <rect x='-48' y='-48' width='96' height='96' rx='10' transform='rotate(45)' fill='url(#gold-grad)' stroke='#451a03' stroke-width='5'/>
    </g>
    <!-- Círculo Interno de Ataque -->
    <circle cx='0' cy='0' r='56' fill='url(#attack-shield)' stroke='#713f12' stroke-width='4'/>
    <!-- Número do Ataque -->
    <text x='0' y='28' font-family='Arial, sans-serif' font-weight='900' font-size='84' fill='#fef08a' stroke='#451a03' stroke-width='10' paint-order='stroke fill' text-anchor='middle' filter='url(#text-shadow)'>
      7
    </text>
  </g>

  <!-- 4. ÍCONE DE VIDA - Inferior Direito -->
  <g transform='translate(733, 1160)' filter='url(#drop-shadow)'>
    <!-- Borda Externa da Gota de Vida -->
    <path d='M0,-72 C45,-25 65,15 65,40 C65,75 36,95 0,95 C-36,95 -65,75 -65,40 C-65,15 -45,-25 0,-72 Z' fill='url(#gold-grad)' stroke='#450a0a' stroke-width='6'/>
    <!-- Gema Vermelha Rubi de Vida -->
    <path d='M0,-58 C38,-20 54,12 54,34 C54,64 30,80 0,80 C-30,80 -54,64 -54,34 C-54,12 -38,-20 0,-58 Z' fill='url(#health-gem)' stroke='#fca5a5' stroke-width='3'/>
    <!-- Brilho no topo da gota -->
    <ellipse cx='-16' cy='15' rx='12' ry='24' fill='#ffffff' opacity='0.35' transform='rotate(-25 -16 15)'/>
    <!-- Número da Vida -->
    <text x='0' y='46' font-family='Arial, sans-serif' font-weight='900' font-size='84' fill='#ffffff' stroke='#450a0a' stroke-width='10' paint-order='stroke fill' text-anchor='middle' filter='url(#text-shadow)'>
      7
    </text>
  </g>
</svg>